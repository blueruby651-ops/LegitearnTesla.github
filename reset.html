<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — LegitEarn</title>
<link rel="icon" href="images/logo.png">
<meta name="theme-color" content="#040a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/homepage.css">
</head>
<body>
<main class="wrap land" style="max-width:460px">
  <div class="land-top"><div class="brand"><i>LE</i><span>Legit<b>Earn</b></span></div></div>
  <section class="auth glass" aria-label="Choose a new password">
    <h1 style="font-size:1.5rem;margin-bottom:.4rem">Choose a new password</h1>
    <p class="muted" id="info" style="margin-bottom:1.2rem;font-size:.9rem">Checking your link…</p>
    <form id="resetForm" class="hidden" novalidate>
      <div class="field"><label for="np">New password (8+ characters)</label><input id="np" type="password" autocomplete="new-password" minlength="8" required><span class="error" aria-live="polite"></span></div>
      <div class="field"><label for="np2">Confirm new password</label><input id="np2" type="password" autocomplete="new-password" required><span class="error" aria-live="polite"></span></div>
      <button class="btn btn-gold btn-block" type="submit">Save new password</button>
    </form>
    <a class="link" href="index.html" id="backLink" style="text-align:center">Back to log in</a>
  </section>
</main>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/reset.js"></script>
</body>
</html>
